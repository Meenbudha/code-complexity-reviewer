name: 🔥 Keep Services Alive

on:
  schedule:
    # Ping every 10 minutes — prevents Render free tier cold starts
    - cron: "*/10 * * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-all-services:
    name: 🏓 Ping All Render Services
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Ping Frontend
        run: |
          URL="https://codemind-frontend.onrender.com"
          echo "Pinging Frontend: $URL"
          STATUS=$(curl --silent --max-time 60 -o /dev/null -w "%{http_code}" "$URL" || echo "timeout")
          echo "Frontend → $STATUS"
          echo "✅ Ping sent (service waking up if it was asleep)"

      - name: 🟡 Ping Backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  RENDER_BACKEND_URL secret not set — skipping."
            echo "    Add it: GitHub → Settings → Secrets → Actions → New secret"
            echo "    Name: RENDER_BACKEND_URL | Value: https://your-backend.onrender.com"
          else
            echo "Pinging Backend: $BACKEND_URL"
            STATUS=$(curl --silent --max-time 60 -o /dev/null -w "%{http_code}" "$BACKEND_URL" || echo "timeout/waking")
            echo "Backend → $STATUS"
            echo "✅ Ping sent"
          fi

      - name: 🤖 Ping ML Service
        env:
          ML_URL: ${{ secrets.RENDER_ML_URL }}
        run: |
          if [ -z "$ML_URL" ]; then
            echo "⚠️  RENDER_ML_URL secret not set — skipping."
            echo "    Add it: GitHub → Settings → Secrets → Actions → New secret"
            echo "    Name: RENDER_ML_URL | Value: https://your-ml-service.onrender.com"
          else
            echo "Pinging ML Service: $ML_URL"
            STATUS=$(curl --silent --max-time 60 -o /dev/null -w "%{http_code}" "$ML_URL" || echo "timeout/waking")
            echo "ML Service → $STATUS"
            echo "✅ Ping sent"
          fi

      - name: ✅ Summary
        run: |
          echo "========================================"
          echo "  Keep-Alive Ping Complete"
          echo "  Time: $(date -u)"
          echo "  Services pinged — cold starts prevented"
          echo "========================================"
