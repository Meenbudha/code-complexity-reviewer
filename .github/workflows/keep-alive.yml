name: 🔥 Keep Services Alive

on:
  schedule:
    # Ping every 10 minutes — prevents Render free tier cold starts (spin-down after 15min)
    - cron: "*/10 * * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-all-services:
    name: 🏓 Ping All Render Services
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Ping Frontend
        run: |
          STATUS=$(curl --silent --max-time 30 -o /dev/null -w "%{http_code}" \
            "https://codemind-frontend.onrender.com")
          echo "Frontend → HTTP $STATUS"

      - name: 🟡 Ping Backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          URL="${BACKEND_URL:-https://your-backend.onrender.com}"
          STATUS=$(curl --silent --max-time 30 -o /dev/null -w "%{http_code}" "$URL")
          echo "Backend → HTTP $STATUS"
          # Secret: RENDER_BACKEND_URL
          # Value: https://your-backend-service-name.onrender.com

      - name: 🤖 Ping ML Service
        env:
          ML_URL: ${{ secrets.RENDER_ML_URL }}
        run: |
          URL="${ML_URL:-https://your-ml-service.onrender.com}"
          STATUS=$(curl --silent --max-time 30 -o /dev/null -w "%{http_code}" "$URL")
          echo "ML Service → HTTP $STATUS"
          # Secret: RENDER_ML_URL
          # Value: https://your-ml-service-name.onrender.com

      - name: ✅ Ping Summary
        run: |
          echo "========================================"
          echo "  Keep-Alive Ping Complete"
          echo "  Time: $(date -u)"
          echo "  All 3 services pinged — cold starts prevented"
          echo "========================================"
