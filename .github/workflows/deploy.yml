name: 🚀 Deploy to Render

on:
  push:
    branches: [main]   # Only deploy when code is merged/pushed to main

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Run Frontend CI before deploying
  # ──────────────────────────────────────────────────────────────────
  frontend-ci:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Run ML Service tests before deploying
  # ──────────────────────────────────────────────────────────────────
  ml-service-ci:
    name: 🐍 ML Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run offline tests
        working-directory: ./ml-service
        run: pytest tests/test_analyze_offline.py -v --tb=short

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to Render (only after CI jobs pass)
  # ──────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → Render
    runs-on: ubuntu-latest
    needs: [frontend-ci, ml-service-ci]   # waits for both CI jobs to pass ✅

    steps:
      - name: 🚀 Trigger Render deploy (Frontend)
        run: |
          curl --silent --fail -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
        # How to get this URL:
        # Render Dashboard → your frontend service → Settings → Deploy Hook → Copy URL
        # Then: GitHub repo → Settings → Secrets → Actions → New Secret
        # Name: RENDER_DEPLOY_HOOK_FRONTEND  |  Value: <paste URL>

  # ──────────────────────────────────────────────────────────────────
  # JOB 4: Deploy ML Service to Render (only after CI jobs pass)
  # ──────────────────────────────────────────────────────────────────
  deploy-ml-service:
    name: 🤖 Deploy ML Service → Render
    runs-on: ubuntu-latest
    needs: [frontend-ci, ml-service-ci]   # waits for both CI jobs to pass ✅

    steps:
      - name: 🚀 Trigger Render deploy (ML Service)
        run: |
          curl --silent --fail -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_ML }}"
        # How to get this URL:
        # Render Dashboard → your ml-service → Settings → Deploy Hook → Copy URL
        # Then: GitHub repo → Settings → Secrets → Actions → New Secret
        # Name: RENDER_DEPLOY_HOOK_ML  |  Value: <paste URL>

  # ──────────────────────────────────────────────────────────────────
  # JOB 5: Notify deployment success
  # ──────────────────────────────────────────────────────────────────
  notify:
    name: ✅ Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-ml-service]
    if: always()

    steps:
      - name: 📣 Print deployment status
        run: |
          echo "========================================"
          echo "  CodeMind AI Deployment Summary"
          echo "========================================"
          echo "  Frontend:   https://codemind-frontend.onrender.com"
          echo "  Triggered:  $(date -u)"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Author:     ${{ github.actor }}"
          echo "========================================"
