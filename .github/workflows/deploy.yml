name: 🚀 Deploy to Render

on:
  push:
    branches: [main]   # Only deploy when code is merged/pushed to main

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Frontend CI
  # ──────────────────────────────────────────────────────────────────
  frontend-ci:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Backend CI
  # ──────────────────────────────────────────────────────────────────
  backend-ci:
    name: 🟡 Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm install

      - name: 🔍 Syntax check server.js
        working-directory: ./backend
        run: node --check server.js

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: ML Service CI
  # ──────────────────────────────────────────────────────────────────
  ml-service-ci:
    name: 🐍 ML Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run offline tests
        working-directory: ./ml-service
        run: python -m pytest tests/test_analyze_offline.py -v --tb=short

  # ──────────────────────────────────────────────────────────────────
  # JOB 4: Deploy Frontend → Render (all 3 CI jobs must pass)
  # ──────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → Render
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, ml-service-ci]

    steps:
      - name: 🚀 Trigger Render deploy (Frontend)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_FRONTEND secret not set — skipping deploy."
            echo "    Add it: GitHub repo → Settings → Secrets → Actions → New secret"
          else
            echo "🚀 Triggering Render deploy for Frontend..."
            curl --silent --fail -X POST "$HOOK"
            echo "✅ Frontend deploy triggered successfully!"
          fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 5: Deploy Backend → Render (all 3 CI jobs must pass)
  # ──────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🟡 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, ml-service-ci]

    steps:
      - name: 🚀 Trigger Render deploy (Backend)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_BACKEND secret not set — skipping deploy."
            echo "    Add it: GitHub repo → Settings → Secrets → Actions → New secret"
          else
            echo "🚀 Triggering Render deploy for Backend..."
            curl --silent --fail -X POST "$HOOK"
            echo "✅ Backend deploy triggered successfully!"
          fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 6: Deploy ML Service → Render (all 3 CI jobs must pass)
  # ──────────────────────────────────────────────────────────────────
  deploy-ml-service:
    name: 🤖 Deploy ML Service → Render
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, ml-service-ci]

    steps:
      - name: 🚀 Trigger Render deploy (ML Service)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_ML }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_ML secret not set — skipping deploy."
            echo "    Add it: GitHub repo → Settings → Secrets → Actions → New secret"
          else
            echo "🚀 Triggering Render deploy for ML Service..."
            curl --silent --fail -X POST "$HOOK"
            echo "✅ ML Service deploy triggered successfully!"
          fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 7: Deployment Summary
  # ──────────────────────────────────────────────────────────────────
  notify:
    name: ✅ Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, deploy-ml-service]
    if: always()

    steps:
      - name: 📣 Print deployment status
        run: |
          echo "========================================"
          echo "  CodeMind AI — Full Deploy Summary"
          echo "========================================"
          echo "  Frontend:   https://codemind-frontend.onrender.com"
          echo "  Backend:    Render (Node.js + MongoDB)"
          echo "  ML Service: Render (Python Flask)"
          echo "  Triggered:  $(date -u)"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Author:     ${{ github.actor }}"
          echo "========================================"
