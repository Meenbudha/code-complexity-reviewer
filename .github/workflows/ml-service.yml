name: 🐍 ML Service CI

on:
  push:
    branches: [main]
    paths:
      - "ml-service/**"
  pull_request:
    branches: [main]
    paths:
      - "ml-service/**"

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest (offline tests only — no API keys needed)
        working-directory: ./ml-service
        run: pytest tests/test_analyze_offline.py -v --tb=short
        # Note: offline tests use analyze_offline() — no Gemini/AWS keys required
        # Add secrets below if you add integration tests later

      - name: 📊 Upload pytest results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ml-service/.pytest_cache/
          retention-days: 3
